<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMD Dépannage Informatique | Pyrénées-Orientales</title>
    <meta name="description" content="JMD Dépannage Informatique est votre expert de confiance pour le dépannage et l'assistance technique dans les Pyrénées-Orientales. Intervention rapide à domicile.">
    
    <!-- Intégration des polices Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CHARTE GRAPHIQUE & CONFIGURATION --- */
        :root {
            --bg-color: #030306;
            --primary-cyan: #3df5f5;
            --text-light: #ffffff;
            --text-gray: #a2b4c7;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 1.2rem;
            line-height: 1.6;
            overflow-x: hidden;
            
            /* Arrière-plan fluide et immersif */
            background-image: url('fond_jmd.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* --- EN-TÊTE MODERNE ET DYNAMIQUE --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            /* Effet "Glassmorphism" : le site défile dessous avec un flou magnifique */
            background: rgba(3, 3, 6, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(61, 245, 245, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        /* Logo en haut à gauche */
        .brand-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 15px;
        }

        .logo-nav-img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            background-color: #000;
            object-fit: cover;
        }

        .logo-text {
            font-family: var(--font-title);
            font-weight: 700;
            color: var(--primary-cyan);
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Menu en haut à droite */
        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            color: var(--primary-cyan);
            transform: translateY(-2px);
        }

        /* --- ZONE BANNER HERO --- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px 20px;
            min-height: 70vh;
        }

        .hero h1 {
            font-family: var(--font-title);
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--primary-cyan);
            text-shadow: 0 0 15px rgba(61, 245, 245, 0.4);
        }

        .hero p {
            max-width: 750px;
            color: var(--text-gray);
            margin-bottom: 45px;
            font-size: 1.5rem;
            font-weight: 500;
        }

        /* Boutons d'interaction */
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .btn-cta {
            display: inline-block;
            background: transparent;
            color: var(--primary-cyan);
            border: 2px solid var(--primary-cyan);
            padding: 15px 35px;
            font-family: var(--font-title);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-cta:hover {
            background: var(--primary-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(61, 245, 245, 0.4);
        }

        .btn-secondary {
            border-color: #ffffff;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* --- SECTION SERVICES ÉPURÉE --- */
        .services {
            padding: 100px 5%;
            background: rgba(3, 3, 6, 0.85);
            border-top: 1px solid rgba(61, 245, 245, 0.1);
        }

        .services h2 {
            text-align: center;
            font-family: var(--font-title);
            color: var(--primary-cyan);
            margin-bottom: 60px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(12, 18, 28, 0.55);
            border: 1px solid rgba(61, 245, 245, 0.15);
            padding: 40px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-cyan);
            background: rgba(12, 18, 28, 0.8);
            box-shadow: 0 10px 30px rgba(3, 3, 6, 0.5);
        }

        .card h3 {
            font-family: var(--font-title);
            margin-bottom: 20px;
            color: var(--primary-cyan);
            font-size: 1.4rem;
        }

        .card p {
            color: var(--text-gray);
            font-size: 1.2rem;
        }

        /* --- SECTION CONTACT ÉPURÉE --- */
        .contact-section {
            padding: 100px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-section h2 {
            font-family: var(--font-title);
            color: var(--primary-cyan);
            margin-bottom: 40px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        .contact-box {
            background: rgba(12, 18, 28, 0.8);
            border: 1px solid rgba(61, 245, 245, 0.2);
            border-radius: 16px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
        }

        .contact-info {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .contact-info p {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contact-info a {
            color: var(--primary-cyan);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s ease;
        }

        .contact-info a:hover {
            opacity: 0.8;
        }

        .btn-maps {
            width: 100%;
            text-align: center;
        }

        /* --- PIED DE PAGE : LA BANNIÈRE EN FOND DE SITE --- */
        .footer-banner-container {
            width: 100%;
            background-color: #000000;
            border-top: 2px solid var(--primary-cyan);
            position: relative;
        }

        .footer-banner-container img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            display: block;
        }

        footer {
            background-color: #000000;
            text-align: center;
            padding: 30px 20px;
            color: var(--text-gray);
            font-size: 1.0rem;
            letter-spacing: 1px;
        }

        /* --- CONFIGURATION MOBILE DROITE ET FLUIDE --- */
        @media (max-width: 768px) {
            header {
                padding: 15px 4%;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            nav a {
                margin-left: 15px;
                font-size: 0.95rem;
            }
            .hero h1 {
                font-size: 2.4rem;
            }
            .hero p {
                font-size: 1.2rem;
            }
            .contact-box {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <header>

            <img src="logo_jmd.png" alt="Logo JMD Officiel" class="logo-nav-img">
            <span class="logo-text">JMD Info</span>

        <nav>
