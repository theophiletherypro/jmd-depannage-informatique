<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMD Dépannage Informatique | Pyrénées-Orientales</title>
    <meta name="description" content="JMD Dépannage Informatique est votre expert de confiance pour le dépannage et l'assistance technique dans les Pyrénées-Orientales. Intervention rapide à domicile.">
    
    <!-- Intégration des polices -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        /* --- CHARTE GRAPHIQUE & VARIABLES --- */
        :root {
            --bg-color: #030306;
            --primary-cyan: #3df5f5;
            --text-light: #ffffff;
            --text-gray: #a2b4c7;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        /* --- BASE & FOND TRÈS ÉTOILÉ (Haute densité de constellations) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 1.2rem;
            line-height: 1.6;
            overflow-x: hidden;
            
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 120px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 280px 180px, #fff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 310px 90px, rgba(255,255,255,0.95), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 370px 220px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 420px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 480px 140px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 530px 270px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 590px 110px, #fff, rgba(0,0,0,0));
            background-size: 500px 300px;
            background-repeat: repeat;
        }

        /* BANNIÈRE */
        .top-banner {
            width: 100%;
            background-color: #000;
            border-bottom: 2px solid var(--primary-cyan);
            min-height: 80px;
        }

        .top-banner img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* MENU NAVIGATION */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(3, 3, 6, 0.95);
            border-bottom: 1px solid rgba(61, 245, 245, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-nav {
            font-family: var(--font-title);
            font-weight: 700;
            color: var(--primary-cyan);
            text-decoration: none;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary-cyan);
        }

        /* ACCUEIL HERO */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            object-fit: cover;
            background-color: #000;
        }

        .hero h1 {
            font-family: var(--font-title);
            font-size: 2.4rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--primary-cyan);
        }

        .hero p {
            max-width: 650px;
            color: var(--text-gray);
            margin-bottom: 35px;
            font-size: 1.3rem;
        }

        /* CONTAINER DES BOUTONS D'ACCUEIL */
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        /* BOUTONS SOBRES SANS NEON */
        .btn-cta {
            display: inline-block;
            background: transparent;
            color: var(--primary-cyan);
            border: 2px solid var(--primary-cyan);
            padding: 12px 30px;
            font-family: var(--font-title);
            font-size: 0.90rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn-cta:hover {
            background: var(--primary-cyan);
            color: var(--bg-color);
        }

        .btn-google {
            border-color: #ffffff;
            color: #ffffff;
        }

        .btn-google:hover {
            background: #ffffff;
            color: #000000;
        }

        /* SERVICES */
        .services {
            padding: 60px 5%;
            background: rgba(3, 3, 6, 0.85);
            border-top: 1px solid rgba(61, 245, 245, 0.1);
            border-bottom: 1px solid rgba(61, 245, 245, 0.1);
        }

        .services h2 {
            text-align: center;
            font-family: var(--font-title);
            color: var(--primary-cyan);
            margin-bottom: 40px;
        }

        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(12, 18, 28, 0.7);
            border: 1px solid rgba(61, 245, 245, 0.15);
            padding: 30px;
            border-radius: 8px;
        }

        .card h3 {
            font-family: var(--font-title);
            margin-bottom: 15px;
            color: var(--primary-cyan);
        }

        /* CONTACT */
        .contact-section {
            padding: 60px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .contact-section h2 {
            font-family: var(--font-title);
            color: var(--primary-cyan);
            margin-bottom: 25px;
        }

        .contact-box {
            background: rgba(12, 18, 28, 0.9);
            border: 1px solid rgba(61, 245, 245, 0.2);
            border-radius: 12px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-contact {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            margin-bottom: 25px;
            object-fit: cover;
            background-color: #000;
        }

        .contact-info {
            margin-top: 15px;
            font-size: 1.3rem;
            width: 100%;
        }

        .contact-info p {
            margin-bottom: 8px;
        }

        .contact-info a {
            color: var(--primary-cyan);
            text-decoration: none;
            font-weight: bold;
        }

        .btn-maps-footer {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-gray);
            font-size: 1rem;
            border-top: 1px solid rgba(61, 245, 245, 0.1);
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 1.8rem; }
            nav a { margin: 0 10px; }
            .logo-img { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <!-- BANNIÈRE EN HAUT -->
    <div class="top-banner">
        <img src="banniere-jmd.png" alt="JMD Dépannage Informatique">
    </div>

    <header>
        <a href="#" class="logo-nav">JMD INFORMATIQUE</a>
        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="accueil">
        <!-- LOGO CENTRAL -->
        <div class="logo-container">
            <img src="logo-jmd.png" class="logo-img" alt="Logo JMD">
        </div>
        <h1>JMD <br><span>DÉPANNAGE INFORMATIQUE</span></h1>
        <p>Votre expert de confiance pour le dépannage et l'assistance technique dans les Pyrénées-Orientales. Intervention rapide à domicile pour particuliers et professionnels.</p>
        
        <div class="hero-buttons">
            <a href="#contact" class="btn-cta">Prendre RDV</a>
            <a href="https://share.google" target="_blank" class="btn-cta btn-google">⭐ Avis Clients Google</a>
